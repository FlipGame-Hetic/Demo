services:
  front-screen:
    image: ghcr.io/flipgame-hetic/front-screen:main
    pull_policy: always
    ports: ["0:80"]
    environment:
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-production-cabinet}
      VITE_SCREEN_HUB_URL: ${VITE_SCREEN_HUB_URL:-screen-hub-url}
      VITE_SCREEN_TOKEN: ${FRONT_SCREEN_TOKEN:-front-screen-token}
      VITE_WS_URL: ${VITE_WS_URL:-vite-ws-url}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 5s
      timeout: 2s
      retries: 5

  back-screen:
    image: ghcr.io/flipgame-hetic/back-screen:main
    pull_policy: always
    ports: ["0:80"]
    environment:
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-production-cabinet}
      VITE_SCREEN_HUB_URL: ${VITE_SCREEN_HUB_URL:-screen-hub-url}
      VITE_SCREEN_TOKEN: ${BACK_SCREEN_TOKEN:-back-screen-token}
      VITE_WS_URL: ${VITE_WS_URL:-vite-ws-url}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}

  dmd-screen:
    image: ghcr.io/flipgame-hetic/dmd-screen:main
    pull_policy: always
    ports: ["0:80"]
    environment:
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-production-cabinet}
      VITE_SCREEN_HUB_URL: ${VITE_SCREEN_HUB_URL:-screen-hub-url}
      VITE_SCREEN_TOKEN: ${DMD_SCREEN_TOKEN:-dmd-screen-token}
      VITE_WS_URL: ${VITE_WS_URL:-vite-ws-url}

  api:
    image: ghcr.io/flipgame-hetic/backend:main
    pull_policy: always
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/flipper.db}
      SCREEN_JWT_SECRET: ${SCREEN_JWT_SECRET:-change_me_change_me_change_me}
    volumes:
      - backend-data:/data
    restart: on-failure
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "out=$$(wget -qO- http://localhost:8080/health 2>&1); rc=$$?; [ $$rc -ne 0 ] && echo \"[api-health] $$out\" >/proc/1/fd/2; exit $$rc"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.d:/etc/nginx/default.d:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "out=$$(wget -qO- http://localhost/nginx/health 2>&1); rc=$$?; [ $$rc -ne 0 ] && echo \"[nginx-health] $$out\" >/proc/1/fd/2; exit $$rc"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "0.0.0.0:1883:1883"
      - "0.0.0.0:9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "out=$$(mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 2>&1); rc=$$?; [ $$rc -ne 0 ] && echo \"[mosquitto-health] $$out\" >/proc/1/fd/2; exit $$rc"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  backend-data:
  mosquitto-data:
